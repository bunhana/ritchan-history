let state={era:null,queue:[],pos:0,locked:false};
const store=()=>JSON.parse(localStorage.getItem("ritchanHistoryV25")||'{"progress":{},"cards":{},"today":0}');
const save=s=>localStorage.setItem("ritchanHistoryV25",JSON.stringify(s));
function renderHome(){let s=store();document.getElementById("todayCorrect").textContent=s.today||0;document.getElementById("cardCount").textContent=Object.keys(s.cards||{}).length;

function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");window.scrollTo(0,0)}
function startEra(id){state.era=id;let pool=Q[id];state.queue=[];for(let i=0;i<Math.min(50,pool.length);i++)state.queue.push(i);for(let i=state.queue.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[state.queue[i],state.queue[j]]=[state.queue[j],state.queue[i]]}state.pos=0;document.getElementById("quizEra").textContent=eras.find(e=>e.id===id).name;document.getElementById("qTotal").textContent=state.queue.length;show("quiz");renderQuestion()}
function renderQuestion(){
setQuizFriend();
state.locked=false;let q=Q[state.era][state.queue[state.pos]];document.getElementById("qNow").textContent=state.pos+1;document.getElementById("qType").textContent=q[0];document.getElementById("question").innerHTML=q[1];let c=document.getElementById("choices");c.innerHTML="";q[2].forEach((x,i)=>{let b=document.createElement("button");b.className="choice";b.innerHTML=x;b.addEventListener("click",()=>answer(i,b));c.appendChild(b)});document.getElementById("feedback").style.display="none";document.getElementById("nextBtn").style.display="none"}
function answer(i,btn){if(state.locked)return;state.locked=true;let q=Q[state.era][state.queue[state.pos]],buttons=[...document.querySelectorAll(".choice")];buttons[q[3]].classList.add("correct");let ok=i===q[3];if(!ok)btn.classList.add("wrong");let f=document.getElementById("feedback");f.innerHTML=(ok?"⭕ 正解！":"❌ ここを覚えよう")+"<br>"+q[4];f.style.display="block";document.getElementById("nextBtn").style.display="block";let s=store();if(ok)s.today=(s.today||0)+1;save(s)}
function nextQuestion(){let s=store();s.progress=s.progress||{};s.progress[state.era]=Math.max(s.progress[state.era]||0,state.pos+1);save(s);state.pos++;if(state.pos>=state.queue.length){s=store();s.cards=s.cards||{};s.cards[state.era]=true;s.progress[state.era]=50;save(s);document.getElementById("completeText").textContent=eras.find(e=>e.id===state.era).name+" 50問達成！";document.getElementById("rewardTitle").textContent=eras.find(e=>e.id===state.era).name+"マスター";show("complete")}else renderQuestion()}
