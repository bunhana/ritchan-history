  const box=document.getElementById("quizDots"); if(!box) return;
  const total=state.queue.length||0, now=state.pos||0; box.innerHTML="";
  for(let i=0;i<Math.min(total,10);i++){
    const d=document.createElement("span");
    d.className="dot"+(i===Math.floor(now/Math.max(1,total/10))?" active":"");
    box.appendChild(d);
  }
}
function markWeakCurrent(){
  if(!state.era||!state.queue.length) return;
  let s=store(); s.wrongBank=s.wrongBank||{};
  let wb=Array.isArray(s.wrongBank[state.era])?s.wrongBank[state.era].slice():[];
  const idx=state.queue[state.pos];
  if(!wb.includes(idx)) wb.push(idx);
  s.wrongBank[state.era]=wb; save(s); refreshWrongReviewButton65();
  alert("この問題を『苦手』に入れたよ。");
}
function submitAnswer(){
  if(state.selectedChoice==null){ alert("こたえを1つえらんでね。"); return; }
  answer(state.selectedChoice);
}

  if(state.locked||(state.responses&&state.responses[state.pos])) return;

 try{
  const raw=localStorage.getItem(STORE_KEY);
  if(!raw)return base;
  const s=JSON.parse(raw)||{};
  return {
   ...base,...s,
   progress:(s.progress&&typeof s.progress==="object")?s.progress:{},
   cards:(s.cards&&typeof s.cards==="object")?s.cards:{},
   sessions:(s.sessions&&typeof s.sessions==="object")?s.sessions:{},
   wrongBank:(s.wrongBank&&typeof s.wrongBank==="object")?s.wrongBank:{}
  };
 }catch(e){return base}
}

 try{localStorage.setItem(STORE_KEY,JSON.stringify(s))}catch(e){}
}

function chronoRank(q){
 const t=q[1]+" "+q[2].join(" ")+" "+q[4];
 for(let i=0;i<CHRONO.length;i++) if(t.includes(CHRONO[i])) return i;
 return 999;
}

function beginEra(){
 state.mode="normal";
 let id=state.era,pool=Q[id],s=store();
 if(!id||!pool||!Array.isArray(pool)||pool.length===0)return;
 s.studyCount=(s.studyCount||0)+1;
 s.sessions=s.sessions||{};
 const sess=s.sessions[id];

 const validQueue=sess&&Array.isArray(sess.queue)&&sess.queue.length===50&&
   sess.queue.every(i=>Number.isInteger(i)&&i>=0&&i<pool.length);

 if(validQueue){
   state.queue=sess.queue.slice();
   state.responses={};
   const saved=(sess.responses&&typeof sess.responses==="object")?sess.responses:{};
   for(const [k,v] of Object.entries(saved)){
     const n=Number(k);
     if(Number.isInteger(n)&&n>=0&&n<state.queue.length&&v&&Number.isInteger(v.choice)){
       state.responses[n]={choice:v.choice};
     }
   }

   let wanted=Math.min(Math.max(0,Number(sess.pos)||0),state.queue.length-1);
   if(state.responses[wanted]){
     const firstUnanswered=state.queue.findIndex((_,idx)=>!state.responses[idx]);
     if(firstUnanswered>=0) wanted=firstUnanswered;
     else{
       state.responses={};
       wanted=0;
     }
   }
   state.pos=wanted;
 }else{
   state.queue=pool.map((q,i)=>i).sort((a,b)=>chronoRank(pool[a])-chronoRank(pool[b])||a-b);
   state.pos=0;
   state.responses={};
 }

 state.locked=false;
 save(s);
 document.getElementById("quizEra").textContent=eras.find(e=>e.id===id).name;
 document.getElementById("qTotal").textContent=state.queue.length;
 saveSession();
 show("quiz");
 renderQuestion();
}


function beginWrongReview(){
 const id=state.era,pool=Q[id],s=store();
 if(!id||!pool)return;
 const raw=Array.isArray((s.wrongBank||{})[id])?(s.wrongBank||{})[id]:[];
 const wrong=[...new Set(raw)].filter(i=>Number.isInteger(i)&&i>=0&&i<pool.length);
 if(!wrong.length){
   alert("まだ間違えた問題はありません。");
   refreshWrongReviewButton65();
   return;
 }
 state.mode="wrong";
 state.queue=wrong.sort((a,b)=>chronoRank(pool[a])-chronoRank(pool[b])||a-b);
 state.pos=0;
 state.responses={};
 state.locked=false;
 document.getElementById("quizEra").textContent=eras.find(e=>e.id===id).name+"　🔁まちがい復習";
 document.getElementById("qTotal").textContent=state.queue.length;
 show("quiz");
 renderQuestion();
}

function saveSession(){
 if(state.mode==="wrong")return;
 if(!state.era||!state.queue.length)return;
 let s=store();s.sessions=s.sessions||{};
 s.sessions[state.era]={queue:state.queue.slice(),pos:state.pos,responses:state.responses||{}};
 save(s);
}
function quitQuiz(){saveSession();goHome()}
function prevQuestion(){
 if(state.pos<=0)return;
 state.pos--;saveSession();renderQuestion();
}
function forwardQuestion(){
 if(state.pos>=state.queue.length-1)return;
 state.pos++;saveSession();renderQuestion();
}
function goFirstQuestion(){
 state.pos=0;
 saveSession();
 renderQuestion();
 window.scrollTo({top:0,behavior:"smooth"});
}

function addRuby(s){
 if(s==null)return "";
 s=String(s);
 if(/<ruby/.test(s)) return s;
 let out="",i=0;
 while(i<s.length){
   let hit=null;
   for(const [w,r] of FULL_RUBY_PAIRS){
     if(w && s.startsWith(w,i)){ hit=[w,r]; break; }
   }
   if(hit){ out+=`<ruby>${hit[0]}<rt>${hit[1]}</rt></ruby>`; i+=hit[0].length; }
   else { out+=s[i]; i++; }
 }
 return out;
}

 document.getElementById("qType").textContent=q[0];
 let qhtml=addRuby(q[1]).replace(/(\d+年)/g,'<span class="year">$1</span>');
 document.getElementById("question").innerHTML=qhtml;
 let c=document.getElementById("choices"); c.innerHTML="";
 const prior=(state.responses||{})[state.pos];
 q[2].forEach((x,i)=>{
   let b=document.createElement("button"); b.className="choice"; b.type="button";
   b.innerHTML=`<span class="num">${i+1}</span><span class="choice-text">${optionToRubyHtml(x)}</span><span class="petal">🌸</span>`;
   if(prior){
     b.disabled=true;
     if(i===q[3]) b.classList.add("correct");
     else if(i===prior.choice) b.classList.add("wrong");
   }else{
     b.addEventListener("click",()=>selectChoice(i));
   }
   c.appendChild(b);
 });

function getExtraDetail(q){
 const ans=q[2][q[3]];
 if(EXTRA_DETAILS[ans]) return EXTRA_DETAILS[ans];
 for(const k of Object.keys(EXTRA_DETAILS)){
   if(q[1].includes(k)) return EXTRA_DETAILS[k];
 }
 const type=q[0];
 if(type==="年号") return "年号だけでなく、その年に起こった出来事・関係する人物・前後の流れまで一緒に覚えると、並べ替え問題にも強くなります。";
 if(type==="人物") return "人物名だけでなく、『何をした人か』『どの時代のどの出来事と結びつくか』までセットで覚えましょう。";
 if(type==="文化"||type==="宗教"||type==="建築"||type==="寺院"||type==="文字") return "文化史は、人物・作品・建物・宗教を線でつなぐように整理すると覚えやすくなります。";
 if(type==="制度"||type==="政治"||type==="土地"||type==="荘園"||type==="税") return "制度の名前だけでなく、『なぜ作られたか』『その結果どうなったか』までつなげて理解すると得点しやすくなります。";
 if(type==="外交") return "相手国、目的、関係人物、その後の日本への影響までセットで整理すると流れがつかみやすくなります。";
 if(type==="順番"||type==="つながり") return "出来事を単独で覚えるのではなく、前後関係と原因・結果をつなげて整理するのがポイントです。";
 if(type==="漢字") return "漢字は意味と一緒に覚えると定着しやすくなります。似た用語との書き分けにも注意しましょう。";
 return "正解だけで終わらず、関連する人物・年号・出来事まで一緒に確認しておくと、別の聞かれ方にも対応できます。";
}

     }
   }
   if(next>=0){
     state.pos=next;
     state.locked=false;
     show("quiz");
     renderQuestion();
   }
   return;
 }
