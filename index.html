function normalizeYearQuestions(){
 const fallback={
 asukaNara:[
 ["年号","仏教が伝わったとされる年は？",["538年","593年","645年","710年"],0,"538年に仏教が伝わったとされます。"],
 ["年号","冠位十二階が定められた年は？",["593年","603年","604年","607年"],1,"603年に冠位十二階が定められました。"],
 ["年号","十七条の憲法が定められた年は？",["603年","604年","607年","645年"],1,"604年に十七条の憲法が定められました。"],
 ["年号","大化の改新が始まった年は？",["604年","645年","663年","672年"],1,"645年に大化の改新が始まりました。"],
 ["年号","平城京に都が移された年は？",["694年","701年","710年","743年"],2,"710年に平城京へ都が移されました。"],
 ["年号","墾田永年私財法が出された年は？",["723年","733年","743年","753年"],2,"743年に墾田永年私財法が出されました。"]],
 heian:[
 ["年号","長岡京に都が移された年は？",["774年","784年","794年","804年"],1,"784年に長岡京へ都が移されました。"],
 ["年号","平安京に都が移された年は？",["784年","794年","804年","894年"],1,"794年に平安京へ都が移されました。"],
 ["年号","遣唐使の停止が決まった年は？",["804年","864年","894年","904年"],2,"894年に遣唐使の停止が決まりました。"],
 ["年号","藤原道長が摂政になった年は？",["996年","1006年","1016年","1026年"],2,"1016年に藤原道長が摂政になりました。"]]
 };
 for(const id of Object.keys(Q)){
   let n=0;
   Q[id]=Q[id].map(q=>{
     if(q[0]!=="年号") return q;
     const pair=q[1].includes("組み合わせ")||q[1].includes("組合せ")||q[1].includes("それぞれ")||q[2].some(x=>(x.match(/年/g)||[]).length>1);
     if(!pair) return q;
     const a=fallback[id]||fallback.asukaNara; return a[(n++)%a.length];
   });
 }
}
normalizeYearQuestions();

function beginEra(){

 // Same question text is shown only once. Older topics are prioritized.

 const unique=pool.map((q,i)=>({q,i})).filter(x=>{const k=x.q[1];if(seen.has(k))return false;seen.add(k);return true});

}
